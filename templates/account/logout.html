{% extends "base.html" %}

{% block title %}Sign out | Filipino Talent{% endblock %}

{% block content %}
<section>
  <h1>Sign out</h1>
  <p class="lead">Are you sure you want to sign out?</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button class="btn" type="submit">Sign out</button>
    <a class="btn secondary" href="/account">Cancel</a>
  </form>
</section>
{% endblock %}
